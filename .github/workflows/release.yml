name: Release skill plugin

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate
        run: python3 .github/scripts/validate_agents.py
      - name: Verify tag matches manifest version
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Package
        run: python3 .github/scripts/package_plugin.py
      - name: Verify checksum
        run: (cd dist && sha256sum -c *.zip.sha256)
      - name: Publish prerelease
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Agentic Harness Agents $GITHUB_REF_NAME" --generate-notes --prerelease --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
