name: Validate agents

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate procedures, adapters, and self-hosting contract
        run: python3 .github/scripts/validate_agents.py
