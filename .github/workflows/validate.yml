name: Validate agents

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill inventory
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f manifest.json
          for d in skills/*; do
            [ -d "$d" ] || continue
            test -f "$d/SKILL.md"
          done
          test -d prompts
          test -d adapters
